<section class="card">
  <h1>Connexion</h1>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>Email
      <input type="email" formControlName="email" />
      @if (form.controls.email.invalid && form.controls.email.touched) {
        <small class="error">Veuillez entrer un email valide.</small>
      }
    </label>
    <label>Mot de passe
      <input type="password" formControlName="password" />
      @if (form.controls.password.invalid && form.controls.password.touched) {
        <small class="error">Le mot de passe est requis.</small>
      }
    </label>
    <button type="submit" [disabled]="form.invalid">Se connecter</button>
  </form>
  @if (error()) {
    <p class="error">{{ error() }}</p>
  }
  <p><a routerLink="/register">Créer un compte</a></p>
</section>
