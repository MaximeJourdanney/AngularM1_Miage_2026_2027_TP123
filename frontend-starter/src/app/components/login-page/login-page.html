<section class="card">
  <h1>Connexion</h1>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Email
      <input type="email" formControlName="email" placeholder="nom@exemple.com" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small class="error">Veuillez renseigner une adresse email valide.</small>
      }
    </label>

    <label>
      Mot de passe
      <input type="password" formControlName="password" placeholder="••••••••" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <small class="error">Le mot de passe est obligatoire.</small>
      }
    </label>

    <button type="submit" [disabled]="loading() || form.invalid">
      {{ loading() ? 'Connexion en cours…' : 'Se connecter' }}
    </button>
  </form>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <p><a routerLink="/register">Pas encore de compte ? Créer un compte</a></p>
</section>
