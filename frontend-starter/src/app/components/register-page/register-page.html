<section class="card">
  <h1>Créer un compte</h1>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Nom d'artiste / Prénom
      <input formControlName="name" placeholder="Ex: Jimi Hendrix" />
      @if (form.controls.name.touched && form.controls.name.invalid) {
        <small class="error">Le nom est requis (minimum 2 caractères).</small>
      }
    </label>

    <label>
      Email
      <input type="email" formControlName="email" placeholder="nom@exemple.com" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small class="error">Veuillez renseigner une adresse email valide.</small>
      }
    </label>

    <label>
      Mot de passe
      <input type="password" formControlName="password" placeholder="Minimum 8 caractères" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <small class="error">Le mot de passe doit contenir au moins 8 caractères.</small>
      }
    </label>

    <button type="submit" [disabled]="loading() || form.invalid">
      {{ loading() ? 'Création en cours…' : 'Créer mon compte' }}
    </button>
  </form>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <p><a routerLink="/login">Déjà inscrit ? Se connecter</a></p>
</section>
